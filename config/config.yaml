app:
  port: "8081"
  env: "development"
  read_timeout: "10s"
  write_timeout: "15s"
  idle_timeout: "60s"

database:
  master_dsn: "postgres://postgres:postgres@localhost:5432/loyalty_databases?sslmode=disable"
  replica_dsn: "postgres://postgres:postgres@localhost:5432/loyalty_databases?sslmode=disable"
  max_conns: 50
  min_conns: 5
  max_conn_idle: "5m"
  max_conn_life: "1h"

jwt:
  secret: "loyalty-engine-super-secret-key-change-in-production"
  signing_method: "HS256"

workers:
  outbox_poll_interval_secs: 5
  expiry_batch_cron: "0 * * * *"
  expiry_batch_size: 500

